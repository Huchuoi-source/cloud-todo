<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Việc cần làm</title>
<style>
  :root { --nen:#eef3f1; --giay:#ffffff; --chu:#1d2b27; --phu:#6b7d77; --nhan:#0f766e; --vien:#d3dfda; --do:#b4372b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--nen); color:var(--chu); font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .phu { color: var(--phu); margin: 0 0 24px; font-family: system-ui, sans-serif; font-size: .95rem; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input[type=text] { flex:1; padding:12px; border:1px solid var(--vien); border-radius:6px; font-size:1rem; background:var(--giay); }
  button { font-family: system-ui, sans-serif; cursor:pointer; }
  .them { padding:12px 18px; border:0; border-radius:6px; background:var(--nhan); color:#fff; font-size:1rem; }
  ul { list-style:none; margin:0; padding:0; background:var(--giay); border:1px solid var(--vien); border-radius:8px; }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--vien); }
  li:last-child { border-bottom:0; }
  li span { flex:1; word-break: break-word; }
  li.xong span { text-decoration: line-through; color: var(--phu); }
  .xoa { border:0; background:none; color:var(--do); font-size:.9rem; }
  .trong { padding:20px; color:var(--phu); font-family:system-ui,sans-serif; }
  .loi { color:var(--do); font-family:system-ui,sans-serif; min-height:1.4em; }
  :focus-visible { outline:2px solid var(--nhan); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Việc cần làm</h1>
  <p class="phu">Dữ liệu lưu trên MongoDB Atlas, ứng dụng chạy trên Render.</p>
  <form id="form">
    <input type="text" id="noidung" placeholder="Nhập việc cần làm" maxlength="200" aria-label="Việc cần làm" required>
    <button class="them" type="submit">Thêm việc</button>
  </form>
  <div class="loi" id="loi" role="alert"></div>
  <ul id="ds"></ul>
</main>
<script>
const ds = document.getElementById('ds');
const loi = document.getElementById('loi');

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json()).loi || 'Có lỗi xảy ra');
  return r.json();
}
const json = (method, body) => ({ method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });

async function tai() {
  try {
    loi.textContent = '';
    const list = await api('/api/tasks');
    ds.innerHTML = '';
    if (!list.length) {
      ds.innerHTML = '<li class="trong">Chưa có việc nào. Nhập việc đầu tiên ở trên.</li>';
      return;
    }
    for (const t of list) {
      const li = document.createElement('li');
      const xong = t.trang_thai === 'da_xong';
      if (xong) li.className = 'xong';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = xong;
      cb.setAttribute('aria-label', 'Đánh dấu đã xong');
      cb.onchange = async () => { await api('/api/tasks/' + t._id, json('PATCH', { trang_thai: cb.checked ? 'da_xong' : 'chua_xong' })); tai(); };
      const sp = document.createElement('span');
      sp.textContent = t.noi_dung;
      const bt = document.createElement('button');
      bt.className = 'xoa'; bt.textContent = 'Xóa';
      bt.onclick = async () => { await api('/api/tasks/' + t._id, { method: 'DELETE' }); tai(); };
      li.append(cb, sp, bt);
      ds.appendChild(li);
    }
  } catch (e) { loi.textContent = e.message; }
}

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const o = document.getElementById('noidung');
  try {
    await api('/api/tasks', json('POST', { noi_dung: o.value }));
    o.value = '';
    tai();
  } catch (err) { loi.textContent = err.message; }
};
tai();
</script>
</body>
</html>
